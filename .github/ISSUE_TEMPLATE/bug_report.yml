name: Rapport de bug
description: Signaler un comportement inattendu de pycatch
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Quel est le problème ?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Un exemple de code minimal qui reproduit le problème.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de pycatch
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Version de Python
      placeholder: "3.12"
    validations:
      required: true
