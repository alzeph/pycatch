[project]
name = "pycatch-safe"
dynamic = ["version"]
description = "Gestion d'erreurs fluide pour Python, inspirée du type Result de Rust : Ok, Err et un décorateur catch pour éviter les try/except imbriqués."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Cédric Hervé Youan", email = "hervecedricyouan@gmail.com" }]
keywords = ["result", "error-handling", "rust", "functional", "railway-oriented-programming", "python", "decorator", "exception"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/alzeph/pycatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pycatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pycatch"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests/typing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pycatch"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
